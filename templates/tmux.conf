# tmux.conf - sensible defaults for running coding agents on a server
# Purpose: touch/mouse scrolling, larger scrollback, snappy Esc, readable status bar.
# Install:  cp tmux.conf ~/.tmux.conf   then   tmux source-file ~/.tmux.conf

# Mouse support: scroll with touch or wheel, click to select panes/windows
set -g mouse on

# Keep a lot of scrollback (long agent output)
set -g history-limit 50000

# Shorter delay after pressing Esc (default is 500 ms and feels laggy)
set -sg escape-time 10

# Number windows and panes from 1 and renumber when one closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Colors
set -g default-terminal "tmux-256color"

# Status bar: session name on the left, host and time on the right
set -g status-left "[#S] "
set -g status-right "#H  %Y-%m-%d %H:%M"
