# codex-config.example.toml - Codex CLI custom provider.
# Purpose: point Codex at an OpenAI-compatible proxy or local server.
# Install: merge into ~/.codex/config.toml (provider settings are NOT allowed in a project-level
#          .codex/config.toml), then export the key named in env_key.
# Custom provider IDs cannot reuse built-in IDs (openai, ollama, lmstudio, and others).
# To change only the address of the built-in OpenAI provider, set openai_base_url instead.
# The model name is a top-level key (not inside the provider table); use a name your proxy serves.
# Codex docs show wire_api = "responses" in their examples but do not say whether it is required;
# check the current Codex config docs for other values your proxy may need.

model_provider = "myproxy"
# model = "YOUR_MODEL_NAME"

[model_providers.myproxy]
name = "My LLM proxy"
base_url = "https://proxy.example.com/v1"
env_key = "MYPROXY_API_KEY"
wire_api = "responses"
