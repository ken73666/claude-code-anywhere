# 00-hardening.conf - sshd hardening drop-in.
# Purpose: key-only SSH, no root login.
# Install: sudo cp 00-hardening.conf /etc/ssh/sshd_config.d/00-hardening.conf
# Then:    sudo sshd -t && sudo systemctl restart ssh     (unit is "sshd" on some distros)
# Verify:  sudo sshd -T | grep -i -E "passwordauth|permitroot"
# The name starts with 00- on purpose: sshd keeps the FIRST value it reads, and files in
# sshd_config.d are read in lexical order, so this must sort before e.g. 50-cloud-init.conf.
# Requires "Include /etc/ssh/sshd_config.d/*.conf" in /etc/ssh/sshd_config.
# WARNING: confirm key login works in a second terminal BEFORE restarting sshd.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
X11Forwarding no
MaxAuthTries 3

# Optional: only allow specific users (uncomment and edit)
# AllowUsers dev
